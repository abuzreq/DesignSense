<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DesignSense guide: from a design space to a decision</title>
    <meta
      name="description"
      content="How to use DesignSense: making a design study in Grasshopper with Colibri or an optimiser, the data.csv format, loading it, and then understanding the design space, narrowing it, deciding and sharing the result."
    />
    <link rel="canonical" href="<%= site %>wiki/" />
    <!-- What a link to this page shows where it is shared (LinkedIn, Slack,
         X and the like), which read these tags and run no script. The
         picture is 1200x630, the shape they crop to; the addresses must be
         absolute (see SITE in webpack.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DesignSense" />
    <meta property="og:title" content="DesignSense guide: from a design space to a decision" />
    <meta
      property="og:description"
      content="How to use DesignSense: make a design study, load it, then understand the design space, narrow it, decide between the options and share the result."
    />
    <meta property="og:url" content="<%= site %>wiki/" />
    <meta property="og:image" content="<%= site %>social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DesignSense: make sense of generated design options. The app showing a study of 648 window designs in linked views."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The SVG carries both palettes and follows the browser's theme; the
         .ico is for anything that will not take one, and the PNG is what iOS
         puts on a home screen (see icons/). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- src/guide/guide.css, put here by the build so the guide below is
         dressed before any script runs. -->
    <style>
<%= styles %>
    </style>
  </head>
  <body class="gp-page">
    <!-- The guide itself, docs/guide.md as the build renders it, so the page
         reads without a script. src/guide/page.js then mounts the same guide
         here with its contents, search and live examples. -->
    <div id="guide" class="gp">
      <header class="gp-bar">
        <a class="gp-brand" href="../">DesignSense</a>
        <span class="gp-name">Guide</span>
        <span class="gp-space"></span>
        <a class="gp-open" href="../">Open DesignSense</a>
      </header>
      <div class="gp-body">
        <div class="gd gd--folds">
          <nav class="gd-nav"></nav>
          <main class="gd-main">
            <article class="gd-doc">
<%= require('../docs/guide.md').default %>
            </article>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
