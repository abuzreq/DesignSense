<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta
      name="description"
      content="A design space exploration interface: browse, filter, compare and make sense of generated design options."
    />
    <!-- What a link to this page shows where it is shared (LinkedIn, Slack,
         X and the like), which read these tags and run no script. The
         picture is 1200x630, the shape they crop to; the addresses must be
         absolute (see SITE in webpack.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DesignSense" />
    <meta property="og:title" content="DesignSense: make sense of generated design options" />
    <meta
      property="og:description"
      content="Explore hundreds of generated design options through their pictures, 3D models and data: filter them, shortlist, compare and share the result. Free and open source; your data stays in your browser."
    />
    <meta property="og:url" content="<%= site %>" />
    <meta property="og:image" content="<%= site %>social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DesignSense: make sense of generated design options. The app showing a study of 648 window designs in linked views."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pictures are fetched without saying which page asked for them. A
         gallery asks one host for dozens at once, and Google Drive counts
         those against the referring page: measured in October 2026, the same
         thumbnail answered 200 with no referrer and 429 with one, from a page
         that had just loaded twelve. It also keeps a reader's own address,
         which carries their dataset's link, away from whoever hosts their
         pictures. -->
    <meta name="referrer" content="no-referrer" />
    <!-- The SVG carries both palettes and follows the browser's theme; the
         .ico is for anything that will not take one, and the PNG is what iOS
         puts on a home screen (see icons/). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <noscript>
      DesignSense needs JavaScript to run. Its <a href="wiki/">guide</a> reads
      without it.
    </noscript>
    <!-- src/main.js mounts here. Without this element the build succeeds and
         the page renders nothing. -->
    <div id="app"></div>
    <!-- Never shown: Netlify reads this at deploy time to learn the feedback
         form's fields (see src/feedback.js), and records only fields named
         here. The app posts to it with fetch. -->
    <form
      name="feedback"
      netlify
      netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <input type="text" name="bot-field" />
      <input type="text" name="kind" />
      <textarea name="message"></textarea>
      <input type="email" name="email" />
      <textarea name="context"></textarea>
      <textarea name="errors"></textarea>
      <input type="file" name="screenshot" />
    </form>
  </body>
</html>
