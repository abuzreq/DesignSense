<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="DesignSense">
  <title>DesignSense</title>
  <!--
    Five dimensions inside a D, each with a range brushed on it; where those
    ranges fall spells an S. The frame and the rails change with the browser's
    theme and the brushed ranges do not: on white the frame has to carry the
    shape, on a dark tab the rails would otherwise be the brightest thing in it.
  -->
  <style>
    .frame { stroke: #2177b4; }
    .rail { fill: #c5dcec; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #5b9bd0; }
      .rail { fill: #4a5b68; }
    }
  </style>

  <path class="frame" d="M4.5 3 H24 A21 21 0 0 1 24 45 H4.5 Z" fill="none" stroke-width="3.5" stroke-linejoin="round"/>

  <g class="rail">
    <rect x="9" y="7.75" width="23.5" height="2.5" rx="1.25"/>
    <rect x="9" y="15.25" width="30.5" height="2.5" rx="1.25"/>
    <rect x="9" y="22.75" width="32.25" height="2.5" rx="1.25"/>
    <rect x="9" y="30.25" width="30.5" height="2.5" rx="1.25"/>
    <rect x="9" y="37.75" width="23.5" height="2.5" rx="1.25"/>
  </g>

  <g fill="#f57c00">
    <rect x="18" y="6" width="14" height="6" rx="1"/>
    <rect x="10" y="13.5" width="6" height="6" rx="1"/>
    <rect x="10" y="21" width="22" height="6" rx="1"/>
    <rect x="26" y="28.5" width="6" height="6" rx="1"/>
    <rect x="10" y="36" width="14" height="6" rx="1"/>
  </g>
</svg>
